
server:
  port: ${SERVER_PORT}

spring:
  application:
    name: knowledge-service

  datasource:
    url: ${KNOWLEDGE_DB_URL:${KNOWLEDGE_DATASOURCE_URL:${SPRING_DATASOURCE_URL}}}
    username: ${KNOWLEDGE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${KNOWLEDGE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: INFO