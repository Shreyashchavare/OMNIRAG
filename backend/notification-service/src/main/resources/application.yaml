spring:
  jackson:
    property-naming-strategy: SNAKE_CASE

  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_DB_URL:${NOTIFICATION_DATASOURCE_URL:${SPRING_DATASOURCE_URL}}}
    username: ${NOTIFICATION_DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${NOTIFICATION_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${NOTIFICATION_SERVER_PORT}

notification:
  jwt:
    public-key: ${NOTIFICATION_JWT_PUBLIC_KEY_PATH}
    issuer: ${NOTIFICATION_JWT_ISSUER}

  pagination:
    default-page-size: 20
    max-page-size: 100

  internal-ingestion:
    enabled: false
