spring:
  jackson:
    property-naming-strategy: SNAKE_CASE

  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:postgres}
    password: ${NOTIFICATION_DB_PASSWORD:change-me-local-notification-db-password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${NOTIFICATION_SERVER_PORT:8085}

notification:
  jwt:
    public-key: ${NOTIFICATION_JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}
    issuer: ${NOTIFICATION_JWT_ISSUER:http://localhost:8080}

  pagination:
    default-page-size: 20
    max-page-size: 100

  internal-ingestion:
    enabled: false
