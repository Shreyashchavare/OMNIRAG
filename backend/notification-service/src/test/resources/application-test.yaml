spring:
  jackson:
    property-naming-strategy: SNAKE_CASE

  application:
    name: notification-service-test

  datasource:
    url: ${TEST_NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_test_db}
    username: ${TEST_NOTIFICATION_DB_USERNAME:postgres}
    password: ${TEST_NOTIFICATION_DB_PASSWORD:test}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

notification:
  jwt:
    public-key: classpath:certs/test_public_key.pem
    issuer: http://localhost:8080

  pagination:
    default-page-size: 20
    max-page-size: 100

  internal-ingestion:
    enabled: false
