spring:
  application:
    name: processing-service

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: ${PROCESSING_DB_URL}
    username: ${PROCESSING_DB_USERNAME}
    password: ${PROCESSING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PROCESSING_SERVER_PORT:${PROCESSING_PORT}}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

processing:
  knowledge-service:
    url: ${KNOWLEDGE_SERVICE_URL}
    secret: ${INTERNAL_SERVICE_SECRET}
  multimodal-service:
    url: ${MULTIMODAL_SERVICE_URL}
  embedding-service:
    url: ${EMBEDDING_SERVICE_URL}
  rag-service:
    url: ${RAG_SERVICE_URL}

  orchestration:
    max-attempts: ${PROCESSING_MAX_ATTEMPTS}
    connect-timeout-ms: ${PROCESSING_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${PROCESSING_READ_TIMEOUT_MS}

  executor:
    core-pool-size: ${PROCESSING_EXECUTOR_CORE_POOL_SIZE}
    max-pool-size: ${PROCESSING_EXECUTOR_MAX_POOL_SIZE}
    queue-capacity: ${PROCESSING_EXECUTOR_QUEUE_CAPACITY}
