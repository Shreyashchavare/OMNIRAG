spring:
  application:
    name: processing-service-test

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:h2:mem:processing_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: ${PROCESSING_DB_USERNAME}
    password: ${PROCESSING_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

processing:
  knowledge-service:
    url: http://localhost:8082
  multimodal-service:
    url: http://localhost:8004
  embedding-service:
    url: http://localhost:8003
  rag-service:
    url: http://localhost:8002

  orchestration:
    max-attempts: 3
    connect-timeout-ms: 1000
    read-timeout-ms: 2000

  executor:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 50
