server:
  port: 0

internal:
  service:
    secret: test-internal-secret

spring:
  application:
    name: processing-service-test

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:h2:mem:processing_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

processing:
  knowledge-service:
    url: http://localhost:8082
    secret: test-internal-secret
  multimodal-service:
    url: http://localhost:8003
  embedding-service:
    url: http://localhost:8001
  rag-service:
    url: http://localhost:8002

  orchestration:
    max-attempts: 3
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
    ai-read-timeout-ms: 2000
    retry-initial-delay-ms: 100
    retry-max-delay-ms: 2000
    retry-backoff-multiplier: 2.0

  scheduler:
    pool-size: 2

  recovery:
    watchdog-enabled: true
    watchdog-interval-ms: 60000
    watchdog-initial-delay-ms: 30000
    stale-processing-threshold-ms: 300000
    queued-stale-threshold-ms: 120000
    batch-size: 20

  executor:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 50
