spring:
  jackson:
    property-naming-strategy: SNAKE_CASE

  application:
    name: analytics-service-test

  datasource:
    url: ${TEST_ANALYTICS_DB_URL:jdbc:tc:postgresql:17:///analytics_test_db}
    username: ${TEST_ANALYTICS_DB_USERNAME:test}
    password: ${TEST_ANALYTICS_DB_PASSWORD:test}
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

analytics:
  jwt:
    public-key: classpath:certs/test_public_key.pem
    issuer: http://localhost:8080

  upstream:
    connect-timeout-ms: 1000
    read-timeout-ms: 2000

  pagination:
    default-page-size: 20
    max-page-size: 100
