spring:
  jackson:
    property-naming-strategy: SNAKE_CASE

  application:
    name: analytics-service

  datasource:
    url: ${ANALYTICS_DB_URL:jdbc:postgresql://localhost:5432/analytics_db}
    username: ${ANALYTICS_DB_USERNAME:postgres}
    password: ${ANALYTICS_DB_PASSWORD:change-me-local-analytics-db-password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${ANALYTICS_SERVER_PORT:8080}

analytics:
  jwt:
    public-key: ${ANALYTICS_JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}
    issuer: ${ANALYTICS_JWT_ISSUER:http://localhost:8080}

  upstream:
    connect-timeout-ms: ${ANALYTICS_UPSTREAM_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ANALYTICS_UPSTREAM_READ_TIMEOUT_MS:5000}

  pagination:
    default-page-size: 20
    max-page-size: 100
