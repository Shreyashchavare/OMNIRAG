spring:
  jackson:
    property-naming-strategy: SNAKE_CASE

  application:
    name: analytics-service

  datasource:
    url: ${ANALYTICS_DB_URL:${ANALYTICS_DATASOURCE_URL:${SPRING_DATASOURCE_URL}}}
    username: ${ANALYTICS_DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${ANALYTICS_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${ANALYTICS_SERVER_PORT:${ANALYTICS_PORT}}

analytics:
  jwt:
    public-key: ${ANALYTICS_JWT_PUBLIC_KEY_PATH}
    issuer: ${ANALYTICS_JWT_ISSUER}

  upstream:
    connect-timeout-ms: ${ANALYTICS_UPSTREAM_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${ANALYTICS_UPSTREAM_READ_TIMEOUT_MS}

  pagination:
    default-page-size: 20
    max-page-size: 100
