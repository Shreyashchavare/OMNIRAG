server:
  port: ${SERVER_PORT:${PORT}}

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE

  application:
    name: identity-service

  datasource:
    url: ${IDENTITY_DB_URL:${IDENTITY_DATASOURCE_URL:${SPRING_DATASOURCE_URL}}}
    username: ${IDENTITY_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}}
    password: ${IDENTITY_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

identity:
  otp:
    expiration-minutes: ${IDENTITY_OTP_EXPIRATION_MINUTES}

  refresh-token:
    expiration-days: ${IDENTITY_REFRESH_TOKEN_EXPIRATION_DAYS}

  jwt:
    private-key: ${IDENTITY_JWT_PRIVATE_KEY_PATH}
    public-key: ${IDENTITY_JWT_PUBLIC_KEY_PATH}
    expiration-minutes: ${IDENTITY_JWT_EXPIRATION_MINUTES}
    issuer: ${IDENTITY_JWT_ISSUER}

  security:
    max-failed-login-attempts: ${IDENTITY_MAX_FAILED_LOGIN_ATTEMPTS}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
