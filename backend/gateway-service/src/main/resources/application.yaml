server:
  port: ${SERVER_PORT:${GATEWAY_PORT:8080}}

spring:
  application:
    name: gateway-service
  jackson:
    property-naming-strategy: SNAKE_CASE

gateway:
  services:
    identity:
      url: ${IDENTITY_SERVICE_URL:http://identity-service:8080}
    knowledge:
      url: ${KNOWLEDGE_SERVICE_URL:http://knowledge-service:8080}
    processing:
      url: ${PROCESSING_SERVICE_URL:http://processing-service:8080}
    analytics:
      url: ${ANALYTICS_SERVICE_URL:http://analytics-service:8080}
    notification:
      url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8080}
    rag:
      url: ${RAG_SERVICE_URL:http://rag-service:8000}
    agent:
      url: ${AGENT_SERVICE_URL:http://agent-service:8000}

  http:
    connect-timeout-ms: ${GATEWAY_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${GATEWAY_READ_TIMEOUT_MS:30000}

  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

  jwt:
    public-key: ${GATEWAY_JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}
    issuer: ${GATEWAY_JWT_ISSUER:http://localhost:8080}
