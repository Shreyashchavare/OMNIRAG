server:
  port: ${SERVER_PORT:${GATEWAY_PORT}}

spring:
  application:
    name: gateway-service
  jackson:
    property-naming-strategy: SNAKE_CASE

gateway:
  services:
    identity:
      url: ${IDENTITY_SERVICE_URL}
    knowledge:
      url: ${KNOWLEDGE_SERVICE_URL}
    processing:
      url: ${PROCESSING_SERVICE_URL}
    analytics:
      url: ${ANALYTICS_SERVICE_URL}
    notification:
      url: ${NOTIFICATION_SERVICE_URL}
    rag:
      url: ${RAG_SERVICE_URL}
    agent:
      url: ${AGENT_SERVICE_URL}

  http:
    connect-timeout-ms: ${GATEWAY_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${GATEWAY_READ_TIMEOUT_MS}

  cors:
    allowed-origin: ${FRONTEND_ORIGIN}

  jwt:
    public-key: ${GATEWAY_JWT_PUBLIC_KEY_PATH}
    issuer: ${GATEWAY_JWT_ISSUER}
