
name: omragul-dev

services:
  # ==========================================================
  # FRONTEND
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omragul-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    depends_on:
      - gateway-service
    networks:
      - omragul-network

  # ==========================================================
  # JAVA MICROSERVICES
  # ==========================================================
  gateway-service:
    build:
      context: ./backend/gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      - identity-service
    networks:
      - omragul-network

  identity-service:
    build:
      context: ./backend/identity-service
      dockerfile: Dockerfile
    container_name: identity-service
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-8081}:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${IDENTITY_DATASOURCE_URL:?Set IDENTITY_DATASOURCE_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    networks:
      - omragul-network

  # ==========================================================
  # KNOWLEDGE SERVICE
  # ==========================================================
  knowledge-service:
    build:
      context: ./backend/knowledge-service
      dockerfile: Dockerfile
    container_name: knowledge-service
    ports:
      - "127.0.0.1:${KNOWLEDGE_PORT:-8082}:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/knowledge_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: filesystem:/app/migrations
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./databases/knowledge-service:/app/migrations:ro
    networks:
      - omragul-network

  processing-service:
    build:
      context: ./backend/processing-service
      dockerfile: Dockerfile
    container_name: processing-service
    ports:
      - "127.0.0.1:${PROCESSING_PORT:-8083}:8080"
    restart: unless-stopped
    depends_on:
      - embedding-service
      - rag-service
      - multimodal-service
      - agent-service
    environment:
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      RAG_SERVICE_URL: http://rag-service:8000
      MULTIMODAL_SERVICE_URL: http://multimodal-service:8000
      AGENT_SERVICE_URL: http://agent-service:8000
    networks:
      - omragul-network

  analytics-service:
    build:
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8084}:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${ANALYTICS_DATASOURCE_URL:?Set ANALYTICS_DATASOURCE_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    networks:
      - omragul-network

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-8085}:8080"
    restart: unless-stopped
    networks:
      - omragul-network

  # ==========================================================
  # PYTHON AI SERVICES
  # ==========================================================
  embedding-service:
    build:
      context: ./ai-services/embedding-service
      dockerfile: Dockerfile
    container_name: embedding-service
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8001}:8000"
    restart: unless-stopped
    networks:
      - omragul-network

  rag-service:
    build:
      context: ./ai-services/rag-service
      dockerfile: Dockerfile
    container_name: rag-service
    ports:
      - "127.0.0.1:${RAG_PORT:-8002}:8000"
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    networks:
      - omragul-network

  multimodal-service:
    build:
      context: ./ai-services/multimodal-service
      dockerfile: Dockerfile
    container_name: multimodal-service
    ports:
      - "127.0.0.1:${MULTIMODAL_PORT:-8003}:8000"
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    networks:
      - omragul-network

  agent-service:
    build:
      context: ./ai-services/agent-service
      dockerfile: Dockerfile
    container_name: agent-service
    ports:
      - "127.0.0.1:${AGENT_PORT:-8004}:8000"
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    networks:
      - omragul-network

  # ==========================================================
  # POSTGRESQL
  # ==========================================================
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./databases/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - omragul-network

  # ==========================================================
  # REDIS
  # ==========================================================
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}

    # Keep your existing ports, volumes,
    # healthcheck, and networks below.

  # ==========================================================
  # PGADMIN - OPTIONAL DEVELOPMENT TOOL
  # ==========================================================
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    profiles:
      - tools
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - omragul-network

  # ==========================================================
  # OLLAMA
  # ==========================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - omragul-network

# ==========================================================
# NETWORK
# ==========================================================
networks:
  omragul-network:
    driver: bridge

# ==========================================================
# PERSISTENT VOLUMES
# ==========================================================
volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
  ollama-data:
