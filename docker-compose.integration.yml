name: omragul-integration

services:
  postgres-integration:
    image: postgres:17
    container_name: omragul-integration-postgres
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_integration_db}
      POSTGRES_USER: ${POSTGRES_USER:-omragul_test_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omragul_test_password_123}
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - omragul-integration-postgres-data:/var/lib/postgresql/data
      - ./databases/init-integration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U omragul_test_user -d knowledge_integration_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - omragul-integration-network

  redis-integration:
    image: redis:8-alpine
    container_name: omragul-integration-redis
    restart: "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-omragul_redis_test_secret_123}
    command: [ "sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"" ]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - omragul-integration-redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - omragul-integration-network

  knowledge-service-integration:
    build:
      context: ./backend/knowledge-service
      dockerfile: Dockerfile
    image: omragul-integration-knowledge-service:stage3.7
    container_name: omragul-integration-knowledge-service
    restart: "no"
    ports:
      - "127.0.0.1:18082:8080"
    depends_on:
      postgres-integration:
        condition: service_healthy
      redis-integration:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: "integration"
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-omragul-integration-test-secret-4096-phase2}
      GATEWAY_ASSERTION_PUBLIC_KEY_PATH: "/certs/integration/gateway_assertion_public_key.pem"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-integration:5432/knowledge_integration_db"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-omragul_test_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-omragul_test_password_123}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      REDIS_HOST: "redis-integration"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-omragul_redis_test_secret_123}
    volumes:
      - ./certs:/certs:ro
    networks:
      - omragul-integration-network

  embedding-service-integration:
    build:
      context: ./ai-services/embedding-service
      dockerfile: Dockerfile
    image: omragul-integration-embedding-service:v5
    container_name: omragul-integration-embedding-service
    restart: "no"
    ports:
      - "127.0.0.1:18001:8000"
    environment:
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-omragul-integration-test-secret-4096-phase2}
      OLLAMA_BASE_URL: "http://dummy-ollama-not-used:11434"
      EMBEDDING_MODEL: "bge-m3"
      # Integration environment explicitly permits deterministic fallback because Ollama is not provisioned
      OLLAMA_FALLBACK_EMBEDDINGS: "true"
    networks:
      - omragul-integration-network

  rag-service-integration:
    build:
      context: ./ai-services/rag-service
      dockerfile: Dockerfile
    image: omragul-integration-rag-service:stage3.7
    container_name: omragul-integration-rag-service
    restart: "no"
    ports:
      - "127.0.0.1:18002:8000"
    depends_on:
      knowledge-service-integration:
        condition: service_started
      embedding-service-integration:
        condition: service_started
      redis-integration:
        condition: service_healthy
    environment:
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-omragul-integration-test-secret-4096-phase2}
      GATEWAY_ASSERTION_PUBLIC_KEY_PATH: "/certs/integration/gateway_assertion_public_key.pem"
      KNOWLEDGE_SERVICE_URL: "http://knowledge-service-integration:8080"
      EMBEDDING_SERVICE_URL: "http://embedding-service-integration:8000"
      EMBEDDING_DIMENSION: "1024"
      OLLAMA_BASE_URL: "http://dummy-ollama-not-used:11434"
      OLLAMA_MODEL: "qwen3:4b"
      REDIS_HOST: "redis-integration"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-omragul_redis_test_secret_123}
    volumes:
      - ./certs:/certs:ro
    networks:
      - omragul-integration-network

  agent-service-integration:
    build:
      context: ./ai-services/agent-service
      dockerfile: Dockerfile
    image: omragul-integration-agent-service:stage3.7
    container_name: omragul-integration-agent-service
    restart: "no"
    ports:
      - "127.0.0.1:18003:8000"
    depends_on:
      rag-service-integration:
        condition: service_started
      redis-integration:
        condition: service_healthy
    environment:
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-omragul-integration-test-secret-4096-phase2}
      GATEWAY_ASSERTION_PUBLIC_KEY_PATH: "/certs/integration/gateway_assertion_public_key.pem"
      RAG_SERVICE_URL: "http://rag-service-integration:8000"
      OLLAMA_BASE_URL: "http://dummy-ollama-not-used:11434"
      OLLAMA_MODEL: "qwen3-vl:4b"
      REDIS_HOST: "redis-integration"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-omragul_redis_test_secret_123}
    volumes:
      - ./certs:/certs:ro
    networks:
      - omragul-integration-network

  multimodal-service-integration:
    build:
      context: ./ai-services/multimodal-service
      dockerfile: Dockerfile
    image: omragul-integration-multimodal-service:v5
    container_name: omragul-integration-multimodal-service
    restart: "no"
    ports:
      - "127.0.0.1:18004:8000"
    environment:
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-omragul-integration-test-secret-4096-phase2}
    networks:
      omragul-integration-network:
        aliases:
          - multimodal-mock-integration
          - multimodal-service-integration

  processing-service-integration:
    build:
      context: ./backend/processing-service
      dockerfile: Dockerfile
    image: omragul-integration-processing-service:stage3.7
    container_name: omragul-integration-processing-service
    restart: "no"
    ports:
      - "127.0.0.1:18083:8080"
    depends_on:
      postgres-integration:
        condition: service_healthy
      redis-integration:
        condition: service_healthy
      knowledge-service-integration:
        condition: service_started
      multimodal-service-integration:
        condition: service_started
      rag-service-integration:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      PROCESSING_SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: "integration"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-integration:5432/processing_integration_db"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-omragul_test_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-omragul_test_password_123}
      PROCESSING_DB_URL: "jdbc:postgresql://postgres-integration:5432/processing_integration_db"
      PROCESSING_DB_USERNAME: ${POSTGRES_USER:-omragul_test_user}
      PROCESSING_DB_PASSWORD: ${POSTGRES_PASSWORD:-omragul_test_password_123}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      REDIS_HOST: "redis-integration"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-omragul_redis_test_secret_123}
      REDIS_TIMEOUT_MS: "2000"
      GATEWAY_ASSERTION_REPLAY_ENABLED: "true"
      GATEWAY_ASSERTION_PUBLIC_KEY_PATH: "/certs/integration/gateway_assertion_public_key.pem"
      GATEWAY_ASSERTION_EXPECTED_AUDIENCE: "processing-service"
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-omragul-integration-test-secret-4096-phase2}
      KNOWLEDGE_SERVICE_URL: "http://knowledge-service-integration:8080"
      MULTIMODAL_SERVICE_URL: "http://multimodal-service-integration:8000"
      RAG_SERVICE_URL: "http://rag-service-integration:8000"
      PROCESSING_MAX_ATTEMPTS: "3"
      PROCESSING_CONNECT_TIMEOUT_MS: "1000"
      PROCESSING_READ_TIMEOUT_MS: "5000"
      PROCESSING_AI_READ_TIMEOUT_MS: "30000"
      PROCESSING_WATCHDOG_ENABLED: "true"
      PROCESSING_WATCHDOG_INTERVAL_MS: "60000"
    volumes:
      - ./certs:/certs:ro
    networks:
      - omragul-integration-network

  gateway-service-integration:
    build:
      context: ./backend/gateway-service
      dockerfile: Dockerfile
    image: omragul-integration-gateway-service:stage3.7
    container_name: omragul-integration-gateway-service
    restart: "no"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      processing-service-integration:
        condition: service_started
      knowledge-service-integration:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      GATEWAY_PORT: "8080"
      SPRING_PROFILES_ACTIVE: "integration"
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-omragul-integration-test-secret-4096-phase2}
      GATEWAY_ASSERTION_PRIVATE_KEY_PATH: "/secrets/integration/gateway_assertion_private_key.pem"
      GATEWAY_ASSERTION_ENABLED: "true"
      PROCESSING_SERVICE_URL: "http://processing-service-integration:8080"
      KNOWLEDGE_SERVICE_URL: "http://knowledge-service-integration:8080"
      RAG_SERVICE_URL: "http://rag-service-integration:8000"
      AGENT_SERVICE_URL: "http://agent-service-integration:8000"
      IDENTITY_SERVICE_URL: "http://identity-service-mock:8080"
      GATEWAY_JWT_PUBLIC_KEY_PATH: "classpath:certs/dev_public_key.pem"
      GATEWAY_JWT_ISSUER: "http://localhost:8080"
      GATEWAY_CONNECT_TIMEOUT_MS: "2000"
      GATEWAY_READ_TIMEOUT_MS: "10000"
      FRONTEND_ORIGIN: "http://localhost:3000"
    volumes:
      - ./secrets/integration:/secrets/integration:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - omragul-integration-network

volumes:
  omragul-integration-postgres-data:
    name: omragul-integration-postgres-data
  omragul-integration-redis-data:
    name: omragul-integration-redis-data

networks:
  omragul-integration-network:
    name: omragul-integration-network
    driver: bridge
